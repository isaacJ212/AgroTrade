<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revisar Verificación - AgroTrade Admin</title>
  <meta name="description" content="Revisión detallada de documentos para verificación en AgroTrade." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/base/variables.css" />
  <link rel="stylesheet" href="css/base/reset.css" />
  <link rel="stylesheet" href="css/layout/shell.css" />
  <link rel="stylesheet" href="css/components/buttons.css" />
  <link rel="stylesheet" href="css/components/cards.css" />
  <link rel="stylesheet" href="css/components/forms.css" />
  <link rel="stylesheet" href="css/components/badges.css" />
  <link rel="stylesheet" href="css/components/checklist.css" />
  <link rel="stylesheet" href="css/components/modal.css" />
  <link rel="stylesheet" href="css/components/toast.css" />
  <link rel="stylesheet" href="css/views/verifications.css" />
</head>
<body>

  <div class="app-container">

    <header class="subpage-header">
      <a href="verificaciones.html" class="back-btn" aria-label="Volver">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <h1 class="subpage-title">Revisar verificación</h1>
    </header>

    <div class="content-body">
      
      <div class="review-applicant-banner">
        <img id="reviewApplicantAvatar" src="" alt="Postulante" class="review-applicant-avatar" />
        <div class="review-applicant-info">
          <h2 id="reviewApplicantName" class="review-applicant-name">Cargando...</h2>
          <div id="reviewApplicantSubtext" class="review-applicant-meta">Productor • Finca</div>
          <div class="review-pending-badge">
            <span class="status-dot-amber"></span>
            <span>Pendiente de revisión</span>
          </div>
        </div>
      </div>

      <div class="info-section-card">
        <div class="info-section-header">
          <span>Información enviada</span>
        </div>

        <div class="doc-review-preview-card">
          <div class="doc-review-preview-header">
            <div class="doc-review-title-group">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="7" y1="8" x2="17" y2="8"></line><line x1="7" y1="12" x2="13" y2="12"></line></svg>
              <span>Documento de identidad</span>
            </div>
            <a class="doc-view-full-link" onclick="viewImageLightbox(document.getElementById('reviewDocIdentidadImg').src, 'Documento de Identidad')">Ver completa</a>
          </div>
          <img id="reviewDocIdentidadImg" src="" alt="Documento de identidad" class="doc-preview-image" onclick="viewImageLightbox(this.src, 'Documento de Identidad')" />
        </div>

        <div class="doc-review-preview-card">
          <div class="doc-review-preview-header">
            <div class="doc-review-title-group">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              <span>Fotografía de verificación</span>
            </div>
            <a class="doc-view-full-link" onclick="viewImageLightbox(document.getElementById('reviewDocVerifImg').src, 'Fotografía de verificación')">Ver completa</a>
          </div>
          <img id="reviewDocVerifImg" src="" alt="Fotografía de verificación" class="doc-preview-image" onclick="viewImageLightbox(this.src, 'Fotografía de verificación')" />
        </div>

        <div class="farm-info-grid">
          <div class="farm-info-item span-full">
            <span class="farm-info-label">Nombre del negocio / Finca</span>
            <span class="farm-info-value" id="reviewFarmName">-</span>
          </div>
          <div class="farm-info-item">
            <span class="farm-info-label">RUC / NIT</span>
            <span class="farm-info-value" id="reviewFarmRuc">-</span>
          </div>
          <div class="farm-info-item">
            <span class="farm-info-label">Extensión / Vehículo</span>
            <span class="farm-info-value" id="reviewFarmExt">-</span>
          </div>
        </div>
      </div>

      <div class="checklist-card">
        <h3 class="checklist-title">Lista de verificación</h3>

        <div class="checklist-items-group">
          <label class="checklist-item">
            <input type="checkbox" class="checklist-checkbox" id="checkName" />
            <div class="checklist-text-wrap">
              <span class="checklist-item-title">Nombre coincide</span>
              <span class="checklist-item-desc">El nombre del perfil coincide con el documento oficial.</span>
            </div>
          </label>

          <label class="checklist-item">
            <input type="checkbox" class="checklist-checkbox" id="checkComplete" />
            <div class="checklist-text-wrap">
              <span class="checklist-item-title">Información completa</span>
              <span class="checklist-item-desc">Todos los campos requeridos han sido diligenciados.</span>
            </div>
          </label>

          <label class="checklist-item">
            <input type="checkbox" class="checklist-checkbox" id="checkLegible" />
            <div class="checklist-text-wrap">
              <span class="checklist-item-title">Documento legible</span>
              <span class="checklist-item-desc">Las imágenes proporcionadas son claras y legibles.</span>
            </div>
          </label>
        </div>

        <div class="form-field-group" style="margin-top: 6px;">
          <label for="reviewCommentsInput" class="form-field-label">Comentarios (Opcional)</label>
          <textarea 
            id="reviewCommentsInput" 
            class="form-textarea-input" 
            placeholder="Agregar comentario..."
          ></textarea>
        </div>
      </div>

      <div class="review-actions-group">
        <button id="btnApproveVerificationAction" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span>Aprobar verificación</span>
        </button>
        
        <button id="btnRejectVerificationAction" class="btn-danger-outline">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
          <span>Rechazar</span>
        </button>
      </div>
    </div>

    <div id="imageLightboxModal" class="image-lightbox-modal" onclick="if(event.target === this) closeImageLightbox()">
      <button class="lightbox-close-btn" onclick="closeImageLightbox()" aria-label="Cerrar visor">✕</button>
      <img id="lightboxImg" src="" alt="Documento ampliado" class="lightbox-img-element" />
    </div>

    <div id="toastContainer" class="toast-box-container"></div>

  </div>

  <script src="js/config/constants.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/toast.js"></script>
  <script src="js/services/auth.service.js"></script>
  <script src="js/views/verifications.js"></script>
</body>
</html>
