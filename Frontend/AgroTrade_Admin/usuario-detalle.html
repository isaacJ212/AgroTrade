<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle del Usuario - AgroTrade Admin</title>
  <meta name="description" content="Información detallada del usuario en AgroTrade." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/base/variables.css" />
  <link rel="stylesheet" href="css/base/reset.css" />
  <link rel="stylesheet" href="css/layout/shell.css" />
  <link rel="stylesheet" href="css/components/buttons.css" />
  <link rel="stylesheet" href="css/components/cards.css" />
  <link rel="stylesheet" href="css/components/badges.css" />
  <link rel="stylesheet" href="css/components/toast.css" />
  <link rel="stylesheet" href="css/views/users.css" />
</head>
<body>

  <div class="app-container">

    <header class="subpage-header">
      <a href="usuarios.html" class="back-btn" aria-label="Volver">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
      <h1 class="subpage-title">Detalle del usuario</h1>
    </header>

    <div class="content-body">
      
      <div class="user-detail-hero">
        <img id="userDetailAvatar" src="" alt="Usuario" class="user-detail-avatar-lg" />
        <h2 id="userDetailName" class="user-detail-name">Cargando...</h2>
        <div id="userDetailBadges" class="user-detail-badges"></div>
        <p id="userDetailBio" class="user-detail-bio"></p>
        <button class="btn-primary" style="margin-top: 8px;" onclick="Toast.warning('Modo de edición de perfil en desarrollo')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
          </svg>
          <span>Editar información</span>
        </button>
      </div>

      <div class="info-section-card">
        <div class="info-section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Información personal</span>
        </div>

        <div class="info-key-value-list">
          <div class="info-key-value-item">
            <span class="info-key-label">Nombre completo</span>
            <span class="info-key-value" id="userDetailFullName">-</span>
          </div>
          <div class="info-key-value-item">
            <span class="info-key-label">Correo electrónico</span>
            <span class="info-key-value" id="userDetailEmail">-</span>
          </div>
          <div class="info-key-value-item">
            <span class="info-key-label">Teléfono</span>
            <span class="info-key-value" id="userDetailPhone">-</span>
          </div>
          <div class="info-key-value-item">
            <span class="info-key-label">Fecha de registro</span>
            <span class="info-key-value" id="userDetailRegDate">-</span>
          </div>
          <div class="info-key-value-item">
            <span class="info-key-label">Dirección principal</span>
            <span class="info-key-value" id="userDetailAddress">-</span>
          </div>
        </div>
      </div>

      <div class="info-section-card">
        <div class="info-section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span>Estado de la cuenta</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div class="badge-activo">
            <span class="status-dot-green"></span>
            <span id="userDetailStatus">Activo</span>
          </div>
          <span id="userDetailLastAccess" style="font-size: 0.76rem; color: var(--text-secondary);">Último acceso -</span>
        </div>
      </div>

      <div class="info-section-card">
        <div class="info-section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
          <span>Roles asignados</span>
        </div>
        <div id="userDetailRolesContainer" style="display: flex; gap: 8px;">
          
        </div>
      </div>

      <div class="admin-actions-card">
        <div class="info-section-header">
          <span>Acciones administrativas</span>
        </div>
        <p class="admin-actions-desc">Gestiona la verificación y el acceso de este usuario al sistema.</p>
        <div class="admin-actions-buttons">
          <button id="btnUserReviewVerification" class="btn-outline">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            <span>Revisar verificación</span>
          </button>
          <button class="btn-danger-outline" onclick="Toast.error('Usuario desactivado del sistema')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            <span>Desactivar usuario</span>
          </button>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-box-container"></div>

  </div>

  <script src="js/config/constants.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/toast.js"></script>
  <script src="js/services/auth.service.js"></script>
  <script src="js/views/users.js"></script>
</body>
</html>
